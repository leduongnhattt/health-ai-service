services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--model"
      - "/models/model.gguf"
      # Reduce memory/boot time on CPU (Windows/WSL). Default ctx=32768 is huge for 7B.
      - "--ctx-size"
      - "4096"
      # Avoid too much parallelism on low-resource machines.
      - "--parallel"
      - "1"
    volumes:
      # Put your GGUF file here:
      #   health-ai-service/models/model.gguf
      - ./models:/models:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/v1/models >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 180s

  # Public API (publish only this service)
  health-ai:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Load local-only secrets/config without committing them.
    # `.env` is already ignored by the repo's `.gitignore`.
    env_file:
      - ./.env
    environment:
      MODEL_PATH: "/app/models/model.pkl"
      # Must be set to docker service hostname inside compose network.
      LLAMA_BASE_URL: "http://llama:8080"
      # Optionally point to a bigger food catalog
      # FOODS_CSV_PATH: "/app/data/food.csv"
    volumes:
      - ./models:/app/models:ro
    ports:
      - "8000:8000"
    depends_on:
      - llama

